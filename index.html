<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eFootball Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030a3d;--card:#0a1a78;--line:#2a45d6;--tx:#fff;--mu:#9db3ff;--ac:#35e0ff;--gold:#ffd166;--ok:#4ade80;--bad:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 520px at 50% -120px,#1c3fe0 0,#06125f 50%,var(--bg) 100%) no-repeat var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Noto Sans Bengali",sans-serif;padding-bottom:40px}
header{padding:22px 16px 10px;text-align:center}
h1{margin:0;font:italic 800 40px/1.1 'Barlow Condensed',system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(120deg,transparent 55%,rgba(53,224,255,.12) 55.2%,transparent 56%),linear-gradient(60deg,transparent 72%,rgba(255,79,216,.10) 72.2%,transparent 73%)}
nav button{border-radius:999px}
.bkc{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);margin:8px 0}
header p{margin:6px 0 0;color:var(--mu);font-size:13px}
.tag2{margin-top:2px;font-size:15px;letter-spacing:3px;font-weight:600;color:var(--ac);text-transform:uppercase}
nav{display:flex;gap:6px;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
button,input,select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:9px 12px}
button{cursor:pointer}
button.on,button.pri{background:var(--ac);color:#04121f;border-color:var(--ac);font-weight:600}
button.bad{border-color:var(--bad);color:var(--bad)}
main{padding:8px 12px;max-width:760px;margin:auto}
h2{font-size:18px;margin:18px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th,td{padding:7px 5px;text-align:center;font-size:13px;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:500}
td.n{text-align:left;display:flex;align-items:center;gap:8px;min-width:130px}
tr.q td{background:#1230a8}
tr.q td:first-child{box-shadow:inset 3px 0 var(--ac)}
.lg{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#fff2;flex:none}
.fx{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}
.fx .t{flex:1;display:flex;align-items:center;gap:6px;min-width:0;font-size:13px}
.fx .t:last-of-type{justify-content:flex-end;text-align:right}
.fx .s{min-width:62px;text-align:center;font-weight:700}
.tag{font-size:11px;color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>*{flex:1;min-width:120px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:12px;width:min(92vw,340px)}
dialog::backdrop{background:#000a}
dialog input{width:64px;text-align:center;font-size:20px}
.mu{color:var(--mu);font-size:13px}
.br{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:6px}.bt{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11px}.bt div{display:flex;justify-content:space-between;gap:4px}.bt .w{color:var(--gold);font-weight:700}
select{max-width:100%}
.champ{text-align:center;border-color:var(--gold);padding:16px}
.ini{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#04121f;background:linear-gradient(135deg,#38bdf8,#a78bfa)}
label.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;cursor:pointer}
</style></head><body>
<header><h1>⚽ eFootball Dynasty</h1><div class="tag2">Solo Tournament</div><p id="sub">Loading…</p></header>

<main id="app"></main>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== এখানে নিজের Firebase config বসান ======
const CFG={apiKey:"AIzaSyDi_NxS0hOj4W_tIsEgWf6lTNMRTusuYAA",authDomain:"e-football-124f7.firebaseapp.com",projectId:"e-football-124f7",appId:"1:1004919575376:web:3a413983b9dd1ca657d255"};
// ===============================================
firebase.initializeApp(CFG);
const db=firebase.firestore(),au=firebase.auth();
let dayUser=false,sk='d',MG={},KM=[],P=[],S=null,K=null,R={},Q={},admin=false,role=null,PM={},SA={},mySlot=0,roleLoading=false,tab='table',grp='A',day=1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pl=id=>P.find(p=>p.id===id);
const ini=p=>{const w=String(p.club||'?').trim().split(/\s+/);return esc(((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase())};
const logo=p=>p&&p.logo?`<img class="lg" src="${p.logo}">`:p?`<span class="lg ini">${ini(p)}</span>`:`<span class="lg"></span>`;
const nm=p=>p?`${esc(p.club)} <span class="mu">(${esc(p.name)})</span>`:'—';
db.collection('players').onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
db.doc('meta/state').onSnapshot(s=>{S=s.exists?s.data():null;draw()});
db.doc('meta/ko').onSnapshot(s=>{K=s.exists?s.data():null;draw()});
db.collection('results').onSnapshot(s=>{R={};s.forEach(d=>R[d.id]=d.data());draw()});
db.collection('pending').onSnapshot(s=>{Q={};s.forEach(d=>Q[d.id]=d.data());draw()});
let CL={},CF={};
const ckey=n=>String(n).trim().toLowerCase().replace(/[\/\s]+/g,'_');
db.collection('clubs').onSnapshot(s=>{CL={};s.forEach(d=>CL[d.id]=d.data());draw()});
db.doc('meta/cfg').onSnapshot(s=>{CF=s.exists?s.data():{};draw()});
let unsubs=[];
const can=p=>role==='a1'||(role==='sub'&&PM[p]===true);
const direct=()=>can('approve')||can('editScore');
const PERMS=[['addPlayer','নতুন প্লেয়ার যোগ / লোগো / এডিট'],['replace','প্লেয়ার বদল'],['ko','নকআউট ড্র / ব্র্যাকেট'],['shots','ছবি ডাউনলোড'],['approve','পেন্ডিং রেজাল্ট অ্যাপ্রুভ'],['editScore','অ্যাপ্রুভ হওয়া স্কোর এডিট'],['days','ম্যাচ ডে খোলা / বন্ধ'],['fixtureEdit','ম্যাচের টিম / ডে এডিট (⚙)'],['draw','গ্রুপ ড্র / ম্যানুয়াল গ্রুপ'],['koToggle','Knockout ট্যাব দেখানো / লুকানো']];
au.onAuthStateChanged(async u=>{
  unsubs.forEach(f=>f());unsubs=[];
  role=null;PM={};SA={};mySlot=0;admin=false;roleLoading=!!u;draw();
  if(u&&u.email){
    const em=u.email.toLowerCase();
    try{await db.doc('meta/_probe').set({t:Date.now()});role='a1'}
    catch(e){
      try{const d=await db.doc('subadmins/'+em).get();if(d.exists){role='sub';PM=d.data().perms||{};mySlot=d.data().slot||0}}catch(e2){}
    }
    if(role==='a1')unsubs.push(db.collection('subadmins').onSnapshot(sn=>{SA={};sn.forEach(d=>SA[d.id]=d.data());draw()},()=>{}));
    if(role==='sub')unsubs.push(db.doc('subadmins/'+em).onSnapshot(d=>{if(d.exists){PM=d.data().perms||{};mySlot=d.data().slot||0}else{role=null;admin=false}draw()},()=>{}));
  }
  roleLoading=false;admin=!!role;draw();
});

function table(g){
  const T={};
  P.filter(p=>S.grp[p.id]===g).forEach(p=>T[p.id]={p,pl:0,w:0,d:0,l:0,gf:0,ga:0,pt:0});
  S.fx.filter(f=>f.g===g&&R[f.id]).forEach(f=>{
    const r=R[f.id],h=T[f.h],a=T[f.a];if(!h||!a)return;
    h.pl++;a.pl++;h.gf+=r.hg;h.ga+=r.ag;a.gf+=r.ag;a.ga+=r.hg;
    if(r.hg>r.ag){h.w++;a.l++;h.pt+=3}else if(r.hg<r.ag){a.w++;h.l++;a.pt+=3}else{h.d++;a.d++;h.pt++;a.pt++}
  });
  return Object.values(T).sort((x,y)=>y.pt-x.pt||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
}
function vTable(){
  if(!S)return '<div class="box">ড্র এখনো হয়নি। অ্যাডমিন ড্র করলেই গ্রুপ এখানে দেখা যাবে।</div>';
  return ['A','B'].map(g=>`<h2>Group ${g}</h2><table><tr><th></th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>`+
   table(g).map((t,i)=>`<tr class="${i<4?'q':''}"><td class="n">${logo(t.p)}<span>${esc(t.p.club)}<br><span class="mu">${esc(t.p.name)}</span></span></td><td>${t.pl}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><b>${t.pt}</b></td></tr>`).join('')+'</table>').join('')+
   '<p class="mu">হাইলাইট করা ৪ জন করে মোট ৮ জন নকআউটে যাবে।</p>';
}
function vFix(){
  if(!S)return '<div class="box">ড্র হওয়ার পর ম্যাচ দেখা যাবে।</div>';
  const days=Math.max(...S.fx.map(f=>f.d)),rel=S.open??1,op=admin?days:Math.min(rel,days),latest=Math.min(rel,days);if(!dayUser)day=latest;if(day>op)day=op;
  const list=S.fx.filter(f=>f.g===grp&&f.d===day).map(f=>{
    const r=R[f.id],q=Q[f.id];
    const sc=r?`${r.hg} - ${r.ag}`:q&&admin?`<span class="tag">অপেক্ষায়<br>${q.hg}-${q.ag}</span>`:'vs';
    const btn=r?(can('editScore')?`<button onclick="openScore('${f.id}','${f.h}','${f.a}')">✎</button>`:''):`<button onclick="openScore('${f.id}','${f.h}','${f.a}')">স্কোর</button>`;
    return `<div class="fx"><div class="t">${logo(pl(f.h))}<span>${nm(pl(f.h))}</span></div><div class="s">${sc}</div><div class="t"><span>${nm(pl(f.a))}</span>${logo(pl(f.a))}</div>${btn}${can('fixtureEdit')?`<button onclick="editFx('${f.id}')">⚙</button>`:''}</div>`;
  }).join('');
  return `<div class="row"><button class="${grp==='A'?'on':''}" onclick="grp='A';draw()">Group A</button><button class="${grp==='B'?'on':''}" onclick="grp='B';draw()">Group B</button></div>
  <div class="row"><select onchange="day=+this.value;dayUser=true;draw()">${Array.from({length:op},(_,i)=>op-i).map(n=>`<option value="${n}" ${day===n?'selected':''}>Day ${n}${n>rel?' 🔒 (বন্ধ)':''}${n===latest?' · সর্বশেষ':''}</option>`).join('')}</select></div>${list}`;
}
function vPlayers(){
  if(!P.length)return '<div class="box">এখনো কোনো প্লেয়ার যোগ হয়নি।</div>';
  return `<h2>${P.length} জন প্লেয়ার</h2>`+P.map(p=>`<div class="fx"><div class="t">${logo(p)}<b>${esc(p.club)}</b></div><div class="mu">${esc(p.name)}${S&&S.grp[p.id]?` · ${S.grp[p.id]}`:''}</div></div>`).join('');
}
function vAdmin(){
  if(roleLoading)return '<div class="box mu">লোড হচ্ছে…</div>';
  if(!admin){const u=au.currentUser;if(u)return `<div class="box"><b>এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই</b><p class="mu">${esc(u.email)} — অ্যাডমিন 1 অনুমতি দিলে তবেই কাজ করবে।</p><button onclick="au.signOut()">Logout</button></div>`;return `<div class="box"><b>অ্যাডমিন লগইন</b><div class="row"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"></div><button class="pri" onclick="login()">Login</button></div>`;}
  const pend=Object.entries(Q).map(([id,q])=>{const f=legInfo(id);if(!f)return '';
    return `<div class="fx"><div class="t">${esc(pl(f.h)?.club)}</div><div class="s">${q.hg} - ${q.ag}</div><div class="t">${esc(pl(f.a)?.club)}</div><button class="pri" onclick="approve('${id}')">✓</button><button class="bad" onclick="db.doc('pending/${id}').delete()">✕</button></div>`}).join('')||'<p class="mu">কোনো পেন্ডিং রেজাল্ট নেই।</p>';
  if(S&&!Object.keys(MG).length)MG={...S.grp};
  const mx=S?Math.max(...S.fx.map(f=>f.d)):0,op=S?Math.min(S.open??1,mx):0;
  const dayBox=S&&can('days')?`<div class="box"><b>ম্যাচ ডে (এখন খোলা: Day ${op}/${mx})</b><p class="mu">শুধু খোলা দিনের ম্যাচ প্লেয়াররা দেখবে ও স্কোর দিতে পারবে।</p><div class="row"><button class="pri" onclick="setOpen(${Math.min(op+1,mx)})">Day ${Math.min(op+1,mx)} খুলুন</button><button onclick="setOpen(${mx})">সব দিন খুলুন</button><button class="bad" onclick="setOpen(${Math.max(op-1,1)})">একদিন বন্ধ করুন</button></div></div>`:'';
  const grpBox=P.length&&can('draw')?`<div class="box"><b>ম্যানুয়াল গ্রুপ (A / B)</b><p class="mu">নিজে গ্রুপ ঠিক করতে চাইলে বেছে নিয়ে সেভ করুন। এতে ফিক্সচার নতুন করে তৈরি হবে ও পুরনো রেজাল্ট মুছে যাবে।</p>${P.map(p=>`<div class="fx"><div class="t">${logo(p)}${esc(p.club)}</div><button class="${MG[p.id]==='A'?'on':''}" onclick="setG('${p.id}','A')">A</button><button class="${MG[p.id]==='B'?'on':''}" onclick="setG('${p.id}','B')">B</button></div>`).join('')}<button class="pri" onclick="saveGroups()">গ্রুপ সেভ করুন</button></div>`:'';
  const kv=KM.length?KM:(K?K.q:[{},{},{},{}]);
  const koBox=S&&can('ko')?`<div class="box"><b>নকআউট ব্র্যাকেট (ম্যানুয়াল)</b><p class="mu">কোয়ার্টার ফাইনালে কে কার সাথে খেলবে নিজে ঠিক করুন।</p>${[0,1,2,3].map(i=>`<div class="mu">Quarter-final ${i+1}</div><div class="row"><select onchange="setKM(${i},'a',this.value)">${koOpts((kv[i]||{}).a)}</select><select onchange="setKM(${i},'b',this.value)">${koOpts((kv[i]||{}).b)}</select></div>`).join('')}<button class="pri" onclick="saveKO()">ব্র্যাকেট সেভ করুন</button></div>`:'';
  const nolg=P.filter(p=>!p.logo).length;
  const plBox=P.length&&can('addPlayer')?`<div class="box"><b>প্লেয়ার ও লোগো (${P.length})</b><p class="mu">${nolg?nolg+' জনের আসল লোগো নেই (নামের অক্ষরে ব্যাজ দেখাচ্ছে)। 🔍 আবার খোঁজে, 📷 দিয়ে ছবি দিন।':'সবার লোগো আছে।'}</p>${P.map(p=>`<div class="fx"><div class="t">${logo(p)}<span>${esc(p.club)}<br><span class="mu">${esc(p.name)}</span></span></div><button onclick="refind('${p.id}')">🔍</button><label class="btn">📷<input type="file" accept="image/*" hidden onchange="upLogo('${p.id}',this)"></label><button onclick="editP('${p.id}')">✎</button>${S?'':`<button class="bad" onclick="delP('${p.id}')">✕</button>`}</div>`).join('')}<div class="row"><button onclick="saveLib()">💾 সব লোগো লাইব্রেরিতে সেভ</button></div></div>`:'';
  const inG=S?P.filter(p=>S.grp[p.id]):[],free=S?P.filter(p=>!S.grp[p.id]):[];
  const repBox=S&&can('replace')?`<div class="box"><b>প্লেয়ার বদল (কেউ চলে গেলে)</b><p class="mu">আগে নিচের "প্লেয়ার যোগ করুন" বক্সে নতুন প্লেয়ার ও ক্লাব যোগ করো। তারপর এখানে বেছে নিলে নতুন প্লেয়ার ওই গ্রুপে পুরনো প্লেয়ারের সব ম্যাচে বসে যাবে, পুরনো প্লেয়ার মুছে যাবে।</p><div class="mu">যে চলে গেছে</div><div class="row"><select id="rpo">${inG.map(p=>`<option value="${p.id}">${esc(p.club)} (${esc(p.name)}) · Group ${S.grp[p.id]}</option>`).join('')}</select></div><div class="mu">নতুন প্লেয়ার</div><div class="row"><select id="rpn">${free.map(p=>`<option value="${p.id}">${esc(p.club)} (${esc(p.name)})</option>`).join('')||'<option value="">— আগে নতুন প্লেয়ার যোগ করুন —</option>'}</select></div><div class="row"><button class="pri" onclick="replaceP(true)">পুরনো রেজাল্ট রেখে বদলান</button><button class="bad" onclick="replaceP(false)">পুরনো রেজাল্ট মুছে বদলান</button></div></div>`:'';

function rankStats(k){
  let a=stats();let title,sub,row;
  if(k==='d'){a.sort((x,y)=>x.ga/x.pl-y.ga/y.pl||y.pl-x.pl||x.ga-y.ga);title='Top Defender';sub='Fewest goals conceded per match';row=t=>[(t.ga/t.pl).toFixed(2),t.pl+' matches · '+t.ga+' conceded']}
  else if(k==='s'){a.sort((x,y)=>y.gf/y.pl-x.gf/x.pl||y.pl-x.pl||y.gf-x.gf);title='Top Scorer';sub='Most goals scored per match';row=t=>[(t.gf/t.pl).toFixed(2),t.pl+' matches · '+t.gf+' goals']}
  else{a=topPlayers();title='Top Player';sub='Win 1 · Draw '+fmt(TP().d)+' · Knockout bonus';row=t=>[fmt(t.pts),t.pl+' P · '+t.w+'W '+t.d+'D '+t.l+'L']}
  return{title,sub,list:a.slice(0,8).map(t=>{const[v,s]=row(t);return{t,v,s}})};
}

async function drawBr(x){
  const T=ties(),ids=[];K.q.forEach(q=>ids.push(q.a,q.b));T.forEach(t=>{const w=winner(t);if(w)ids.push(w)});
  const L=await logosFor(ids);
  for(let i=0;i<4;i++){
    const t=T[i],left=i<2,px=left?30:880,base=i%2?570:210,w=winner(t),g=agg(t),any=R[t.id+'_1']||R[t.id+'_2'];
    [[t.a,g.ga],[t.b,g.gb]].forEach(([id,n],k)=>{
      const py=base+k*140,p=pl(id),gr=x.createLinearGradient(px,py,px,py+130);
      x.globalAlpha=w&&w!==id?.45:1;gr.addColorStop(0,'#1e3bff');gr.addColorStop(1,'#0c1aa8');
      rr2(x,px,py,170,130,12,gr);if(w&&w===id){x.strokeStyle=CY;x.lineWidth=4;x.stroke()}
      drawLogo(x,p,L[id],px+85,py+52,36);
      x.textBaseline='middle';x.textAlign='center';x.fillStyle='#fff';x.font='700 18px '+FF;x.fillText(p?fitTxt(x,p.club,150):'TBD',px+85,py+108);
      if(any){const bx=px+(left?150:20);x.beginPath();x.arc(bx,py+20,16,0,7);x.fillStyle=CY;x.fill();x.fillStyle='#04124a';x.font='800 20px '+FF;x.fillText(String(n),bx,py+21)}
      x.globalAlpha=1;
    });
  }
  x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=3;
  const ln=pts=>{x.beginPath();pts.forEach(([a,b],j)=>j?x.lineTo(a,b):x.moveTo(a,b));x.stroke()};
  [0,1].forEach(s=>{const X=v=>s?1080-v:v;
    [[275,415,345],[635,775,705]].forEach(([a,b,c])=>{ln([[X(200),a],[X(250),a],[X(250),c],[X(256),c]]);ln([[X(200),b],[X(250),b],[X(250),c]])});
    ln([[X(344),345],[X(392),345],[X(392),525],[X(396),525]]);ln([[X(344),705],[X(392),705],[X(392),525]]);
  });
  const circ=(cx,cy,r,id)=>{x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle='#fff';x.fill();if(id)drawLogo(x,pl(id),L[id],cx,cy,r-4)};
  circ(300,345,44,winner(T[0]));circ(300,705,44,winner(T[1]));circ(780,345,44,winner(T[2]));circ(780,705,44,winner(T[3]));
  circ(440,525,44,winner(T[4]));circ(640,525,44,winner(T[5]));circ(540,200,44,winner(T[6]));
  trophy(x,540,262,.55);
  x.textBaseline='middle';x.textAlign='center';x.fillStyle=CY;x.font='italic 800 44px '+HF;x.fillText('ROAD TO THE FINAL',540,910);
}

const fmt=v=>String(+v.toFixed(2));
const TP=()=>({d:CF.tpDraw??.5,q:CF.tpQf??.25,s:CF.tpSf??0,f:CF.tpFin??.5});
function topPlayers(){
  const c=TP(),T={},g=id=>T[id]||(T[id]={id,pl:0,w:0,d:0,l:0,pts:0,gf:0,ga:0});
  S.fx.forEach(f=>{
    const r=R[f.id];if(!r)return;const h=g(f.h),a=g(f.a);
    h.pl++;a.pl++;h.gf+=r.hg;h.ga+=r.ag;a.gf+=r.ag;a.ga+=r.hg;
    if(r.hg>r.ag){h.w++;h.pts++;a.l++}else if(r.hg<r.ag){a.w++;a.pts++;h.l++}else{h.d++;a.d++;h.pts+=c.d;a.pts+=c.d}
  });
  ties().forEach(t=>{
    const w=winner(t);if(!w)return;
    const lo=w===t.a?t.b:t.a,bn=t.id[0]==='Q'?c.q:t.id[0]==='F'?c.f:c.s,W=g(w),Lz=g(lo);
    W.pl++;Lz.pl++;W.w++;W.pts+=1+bn;Lz.pts+=bn;
  });
  return Object.values(T).filter(t=>pl(t.id)).sort((x,y)=>y.pts-x.pts||y.w-x.w||y.d-x.d||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
}
let SEAS={};
db.collection('seasons').onSnapshot(sn=>{SEAS={};sn.forEach(d=>SEAS[d.id]=d.data());draw()},()=>{});
const snap=p=>p?{name:p.name,club:p.club,logo:p.logo||''}:{name:'?',club:'?',logo:''};
function seasonRec(){
  if(!K)return null;const F=ties()[6],ch=winner(F);if(!ch)return null;
  const ru=ch===F.a?F.b:F.a;return{season:CF.season||1,champ:snap(pl(ch)),runner:snap(pl(ru)),t:Date.now()};
}
function vPrev(){
  const cur=CF.season||1,items=Object.values(SEAS),live=SEAS[cur]?null:seasonRec();
  if(live){live.live=true;items.push(live)}
  items.sort((a,b)=>b.season-a.season);
  if(!items.length)return `<div class="box">এখনো কোনো সিজন শেষ হয়নি। বর্তমান টুর্নামেন্ট: <b>Season ${cur}</b>। ফাইনাল শেষ হলে বিজয়ী ও রানার্স আপ এখানে দেখা যাবে।</div>`;
  const row=(lab,p)=>`<div class="fx"><div class="s" style="min-width:96px;font-size:12px;text-align:left">${lab}</div><div class="t">${logo(p)}<span>${esc(p.club)}<br><span class="mu">${esc(p.name)}</span></span></div></div>`;
  return items.map(it=>`<h2>Season ${it.season}${it.live?' <span class="mu">(সদ্য শেষ)</span>':''}</h2>`+row('🏆 Champion',it.champ)+row('🥈 Runner-up',it.runner)).join('');
}
function seasonBox(){
  const cur=CF.season||1,ok=!!seasonRec(),tc=TP();
  const tpBox=`<div class="box"><b>Top Player পয়েন্ট</b><p class="mu">গ্রুপে জয় ১ পয়েন্ট। বাকিগুলো এখান থেকে বদলানো যায়।</p><div class="row"><label class="mu">ড্র<input id="tpd" type="number" step="0.05" style="width:100%" value="${tc.d}"></label><label class="mu">Quarter বোনাস<input id="tpq" type="number" step="0.05" style="width:100%" value="${tc.q}"></label></div><div class="row"><label class="mu">Semi বোনাস<input id="tps" type="number" step="0.05" style="width:100%" value="${tc.s}"></label><label class="mu">Final বোনাস<input id="tpf" type="number" step="0.05" style="width:100%" value="${tc.f}"></label></div><button class="pri" onclick="saveTP()">সেভ</button></div>`;
  return tpBox+`<div class="box"><b>সিজন ${cur} (চলছে)</b><p class="mu">ফাইনাল শেষ হলে বিজয়ী ও রানার্স আপ "Previous Top Players" ট্যাবে দেখায়। "নতুন টুর্নামেন্ট" চাপলে নিজে থেকে সেভ হয়ে সিজন নম্বর বাড়বে।</p>${ok?`<button class="pri" onclick="saveSeason()">💾 এখনই Season ${cur} সেভ করুন</button>`:'<p class="mu">ফাইনাল এখনো শেষ হয়নি।</p>'}</div>`;
}
function saveTP(){
  if(role!=='a1')return alert('এই কাজের অনুমতি নেই');
  const g=id=>parseFloat(document.getElementById(id).value),v=[g('tpd'),g('tpq'),g('tps'),g('tpf')];
  if(v.some(n=>isNaN(n)||n<0||n>5))return alert('সঠিক সংখ্যা দিন');
  db.doc('meta/cfg').set({tpDraw:v[0],tpQf:v[1],tpSf:v[2],tpFin:v[3]},{merge:true}).then(()=>alert('সেভ হয়েছে'));
}
async function saveSeason(){
  if(role!=='a1')return alert('এই কাজের অনুমতি নেই');
  const rec=seasonRec();if(!rec)return alert('ফাইনাল এখনো শেষ হয়নি');
  try{await db.doc('seasons/'+rec.season).set(rec);alert('Season '+rec.season+' সেভ হয়েছে।')}catch(e){alert('সেভ হয়নি: '+(e.code||e.message)+' (Firestore Rules-এ seasons যোগ করেছ কিনা দেখো)')}
}
function setOpen(n){if(!(can('days')))return alert('এই কাজের অনুমতি নেই');dayUser=false;db.doc('meta/state').update({open:n})}
function setG(id,g){MG[id]=g;draw()}
async function saveGroups(){if(!(can('draw')))return alert('এই কাজের অনুমতি নেই');
  const A=P.filter(p=>MG[p.id]==='A').map(p=>p.id),B=P.filter(p=>MG[p.id]==='B').map(p=>p.id);
  if(A.length+B.length<P.length)return alert('সবার গ্রুপ বেছে নিন');
  if(A.length<2||B.length<2)return alert('প্রতি গ্রুপে কমপক্ষে ২ জন লাগবে');
  if(S&&!confirm('গ্রুপ বদলালে ফিক্সচার নতুন হবে ও সব রেজাল্ট মুছে যাবে। নিশ্চিত?'))return;
  await applyGroups(A,B);
}
function koOpts(sel){return '<option value="">— বেছে নিন —</option>'+P.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.club)} (${S&&S.grp[p.id]||'-'})</option>`).join('')}
function setKM(i,k,v){if(!KM.length)KM=K?K.q.map(x=>({...x})):[{},{},{},{}];KM[i][k]=v}
async function saveKO(){if(!(can('ko')))return alert('এই কাজের অনুমতি নেই');
  const q=KM.length?KM:(K?K.q:[]);
  const ids=q.flatMap(x=>[x.a,x.b]);
  if(q.length<4||ids.some(x=>!x))return alert('৪টা ম্যাচের সব টিম বেছে নিন');
  if(new Set(ids).size<8)return alert('একই টিম দুইবার দেওয়া যাবে না');
  if(!confirm('ব্র্যাকেট সেভ হবে।'+(K?' আগের নকআউট রেজাল্ট মুছে যাবে।':'')+' নিশ্চিত?'))return;
  const b=db.batch(),ko=/^[QSF]/;
  Object.keys(R).filter(k=>ko.test(k)).forEach(k=>b.delete(db.doc('results/'+k)));
  Object.keys(Q).filter(k=>ko.test(k)).forEach(k=>b.delete(db.doc('pending/'+k)));
  b.set(db.doc('meta/ko'),{q:q.map(x=>({a:x.a,b:x.b})),win:{}});
  await b.commit();KM=[];tab='ko';draw();
}
